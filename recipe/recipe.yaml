context:
  version: "1.1.0"

package:
  name: julday
  version: ${{ version }}

source:
  url: https://gitlab.com/earthscope/public/epic/passoft/julday/-/archive/v${{ version }}/julday-v${{ version }}.tar.gz
  sha256: c4aabbd25ee8a2054748d819141d123a2f6f0d67b87796041a8e35dd9e4b279b

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  python:
    entry_points:
      - julday = julday.julday:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - julday
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - julday 1 1 2020
  - script:
      - python -m unittest discover -s tests
    requirements:
      run:
        - python ${{ python_min }}.*
    files:
      source:
        - tests/

about:
  homepage: https://epic.earthscope.org/content/software-resources
  summary: Display Julian date
  description: |
    Display the current Julian date.
  license: GPL-3.0-or-later
  license_file: LICENSE
  repository: https://gitlab.com/earthscope/public/epic/passoft/julday

extra:
  recipe-maintainers:
    - omid-earthscope
